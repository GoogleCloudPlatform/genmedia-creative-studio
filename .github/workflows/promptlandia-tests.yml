name: Promptlandia Tests CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "experiments/promptlandia/**"
      - ".github/workflows/promptlandia-tests.yml"
  pull_request:
    paths:
      - "experiments/promptlandia/**"
      - ".github/workflows/promptlandia-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/promptlandia

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Run Pytest
        run: |
          uv run pytest tests/unit -v
