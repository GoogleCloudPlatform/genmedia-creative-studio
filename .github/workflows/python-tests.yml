name: Python Tests CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "common/**"
      - "models/**"
      - "pages/**"
      - "config/**"
      - "state/**"
      - "test/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "common/**"
      - "models/**"
      - "pages/**"
      - "config/**"
      - "state/**"
      - "test/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Run Pytest
        env:
          PROJECT_ID: test-project
          LOCATION: us-central1
          VEO_PROJECT_ID: test-project
          VEO_LOCATION: us-central1
        run: |
          uv run pytest test/test_app_imports.py test/test_telemetry.py test/test_gemini_image_models.py -v
