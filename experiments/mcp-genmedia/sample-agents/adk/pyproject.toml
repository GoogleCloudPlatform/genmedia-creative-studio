[project]
name = "adk-genmedia-agent"
version = "0.1.0"
description = "ADK Agent that uses Genmedia MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-adk[gcp,mcp]>=2.8.0",
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19",
    "mcp>=1.30.0",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
]

[tool.uv]
# google-adk caps opentelemetry-api<=1.42.1, which is affected by CVE-2026-114603.
override-dependencies = [
    "opentelemetry-api>=1.45.1",
]
