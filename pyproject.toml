[project]
name = "genmedia-creative-studio"
version = "1.13.1"
description = "GenMedia Creative Studio - Veo, Lyria, Nano Banana, Gemini, Gemini TTS"
readme = "README.md"
requires-python = ">=3.15, <3.16"
dependencies = [
    "fastapi>=0.115.12",
    "firebase-admin>=6.6.0",
    "google-auth[requests]>=2.57.1",
    "google-cloud-aiplatform>=1.79.0",
    "google-genai>=1.63.0",
    "gunicorn>=23.0.0",
    "mediapy>=1.2.2",
    "mesop>=0.14.1",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "shortuuid>=1.0.13",
    "tenacity>=9.0.0",
    "uvicorn>=0.34.2",
    "ruff>=0.1.0", # Using a general version, can be pinned
    "black>=25.1.0",
    "pytest>=8.4.1",
    "google-cloud-texttospeech>=2.27.0",
    "google-cloud-logging>=3.12.1",
    "google-cloud-tasks>=2.16.0",
    "moviepy>=2.0.0",
    "scipy",
    "scikit-image",
    "opencv-python",
    "librosa>=0.11.0",
    "praat-parselmouth>=0.4.6",
    "c2pa-python>=0.27.1",
    "pillow>=12.3.0",
    "pyOpenSSL",
]

[tool.uv]
# MoviePy 2.2.1 caps Pillow below 12, but the local audit requires the
# vulnerability-fixed Pillow 12.2.0 release line. Remove this once MoviePy
# publishes compatible dependency metadata.
override-dependencies = [
    "pillow>=12.3.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
# No explicit target-version: ruff infers it from `requires-python` above, so the
# lint target tracks the declared Python floor automatically. Pinning it here (it
# was "py311") contradicted `requires-python = ">=3.14"` and made ruff report
# valid 3.12+ syntax (e.g. PEP 701 f-string quote reuse) as invalid. See #1863.

[tool.ruff.lint]
# Enable Pyflakes ("F") and Pycodestyle ("E", "W") categories by default.
# select = ["E", "F", "W", "I"]  # I for isort
# Can be more specific or add more rules later
# For example, to emulate Flake8:
select = ["E", "F", "W", "C90", "I", "N", "D", "UP", "ANN", "S", "BLE", "A", "COM", "LOG", "PT", "Q", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PIE", "PL", "TRY", "FLY", "NPY", "PERF", "RUF"]
ignore = ["E501"] # Ignore line too long for now, can be addressed later

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
#skip-string-normalization = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (slow, requires network)",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F401"]
"test/**/*.py" = ["S101", "PLR2004"]
"test/*.py" = ["S101", "PLR2004"]
